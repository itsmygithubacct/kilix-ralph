[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kilix-ralph"
version = "0.2.0"
description = "Durable idle-only agent mailboxes and recurring follow-ups"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[project.scripts]
kilix-ralph = "kilix_ralph.__main__:main"

[tool.setuptools.packages.find]
include = ["kilix_ralph*"]
